name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HUSKY: 0 # Git hooks are for local development only.

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Check for pending model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project Ticketing.Infrastructure --startup-project Ticketing.Api
          --no-build --configuration Release

      # Idempotent SQL covering every migration: safe to run against a database at any version.
      # Lets the schema be reviewed as plain SQL or applied by hand in environments without EF tooling.
      - name: Generate migration SQL script
        run: >
          dotnet ef migrations script --idempotent
          --project Ticketing.Infrastructure --startup-project Ticketing.Api
          --no-build --configuration Release
          --output artifacts/migrations.sql

      - name: Upload migration SQL script
        uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations.sql
          if-no-files-found: error
          retention-days: 30

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
