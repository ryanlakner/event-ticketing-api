name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # "edited" re-checks a renamed PR title.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HUSKY: 0 # Git hooks are for local development only.

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history so the pushed or PR commit range is available.

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # `husky exec` locates its folder through core.hooksPath, which HUSKY=0 leaves unset.
      - name: Configure Husky
        run: dotnet husky install

      # Same script as the local commit-msg hook, so commits made on github.com or with
      # --no-verify are held to the same rules.
      - name: Lint commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No commit range to check."
            exit 0
          fi

          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            dotnet husky exec .husky/csx/commit-lint.csx --args "$RUNNER_TEMP/message" || status=1
            echo "::endgroup::"
          done
          exit $status

      # With squash merges the PR title becomes the commit message on main.
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          dotnet husky exec .husky/csx/commit-lint.csx --args "$RUNNER_TEMP/title"

  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Check for pending model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project Ticketing.Infrastructure --startup-project Ticketing.Api
          --no-build --configuration Release

      # Idempotent SQL covering every migration: safe to run against a database at any version.
      # Lets the schema be reviewed as plain SQL or applied by hand in environments without EF tooling.
      - name: Generate migration SQL script
        run: >
          dotnet ef migrations script --idempotent
          --project Ticketing.Infrastructure --startup-project Ticketing.Api
          --no-build --configuration Release
          --output artifacts/migrations.sql

      - name: Upload migration SQL script
        uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations.sql
          if-no-files-found: error
          retention-days: 30

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Check environment lists are in sync
        working-directory: .
        run: python3 .github/scripts/check-environments.py

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          for dir in . bootstrap; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
